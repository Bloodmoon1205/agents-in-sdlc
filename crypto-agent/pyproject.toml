[project]
name = "jevagent"
version = "0.1.0"
description = "Autonomous crypto trading agent: Opus 5.5 (brain) + Jev (reflex), deterministic risk in code."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
jev = ["typesafe-sdk>=0.7.6"]
brain = ["anthropic>=2.14"]
dev = ["pytest>=8"]

[project.scripts]
jevagent = "jevagent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
